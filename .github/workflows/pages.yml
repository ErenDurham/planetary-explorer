name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire original NASA terrain
        run: python backend/scripts/fetch_mola.py
      - name: Bundle public data and Python engine
        run: python backend/scripts/build_pages_bundle.py
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build static app
        working-directory: frontend
        env:
          VITE_BASE_PATH: /planetary-explorer/
          VITE_PAGES_PYTHON: 'true'
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
